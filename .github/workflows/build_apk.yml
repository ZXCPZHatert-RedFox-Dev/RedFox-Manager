name: Build RedFox-Manager APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle & Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RedFox-Manager-v1.1-Universal.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedFox-Manager-APK
          path: RedFox-Manager-v1.1-Universal.apk
